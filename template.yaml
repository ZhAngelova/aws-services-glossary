AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AWS Services Glossary — serverless CRUD API for a collaborative glossary of AWS services.
  Built for the AWS re/Start with AI bootcamp class.

# -----------------------------------------------------------------------------
# Globals: shared settings applied to every Lambda function in this stack.
# Avoids repeating the same lines on every function.
# -----------------------------------------------------------------------------
Globals:
  Function:
    Timeout: 5
    Runtime: python3.13
    Architectures:
      - x86_64
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        TABLE_NAME: !Ref GlossaryTable
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type'"
      AllowOrigin: "'*'"


# -----------------------------------------------------------------------------
# Resources: every AWS thing this stack creates.
# -----------------------------------------------------------------------------
Resources:

  # DynamoDB table - stores every AWS service term.
  # Partition key (serviceName) enforces uniqueness automatically.
  GlossaryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: aws-services-glossary
      BillingMode: PAY_PER_REQUEST  # On-demand pricing - free-tier eligible, no capacity planning.
      AttributeDefinitions:
        - AttributeName: serviceName
          AttributeType: S  # S = String
      KeySchema:
        - AttributeName: serviceName
          KeyType: HASH  # HASH = partition key


  # Lambda function: create a new term.
  # POST /services with JSON body.
  CreateTermFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: glossary-create-term
      CodeUri: functions/
      Handler: create_term.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GlossaryTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /services
            Method: POST


# Lambda function: list all terms.
  # GET /services
  ListTermsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: glossary-list-terms
      CodeUri: functions/
      Handler: list_terms.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GlossaryTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /services
            Method: GET            


# Lambda function: update an existing term.
  # PUT /services/{name}
  UpdateTermFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: glossary-update-term
      CodeUri: functions/
      Handler: update_term.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GlossaryTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /services/{name}
            Method: PUT


# Lambda function: delete a term.
  # DELETE /services/{name}
  DeleteTermFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: glossary-delete-term
      CodeUri: functions/
      Handler: delete_term.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GlossaryTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /services/{name}
            Method: DELETE


  # S3 bucket for hosting the frontend static website
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: zhasmina-aws-glossary
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false


  # Bucket policy allowing public read access to website files
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: "s3:GetObject"
            Resource: !Sub "${FrontendBucket.Arn}/*"


  # CloudFront distribution for HTTPS and global content delivery
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: "CDN for the AWS Services Glossary frontend"
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: S3WebsiteOrigin
            DomainName: !Select [2, !Split ["/", !GetAtt FrontendBucket.WebsiteURL]]
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              HTTPSPort: 443
        DefaultCacheBehavior:
          TargetOriginId: S3WebsiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        ViewerCertificate:
          CloudFrontDefaultCertificate: true          

  

# -----------------------------------------------------------------------------
# Outputs: values printed after deploy so you can find your resources.
# -----------------------------------------------------------------------------
Outputs:
  ApiUrl:
    Description: Base URL of the Glossary API
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/"
     

  GlossaryTableName:
    Description: DynamoDB table name
    Value: !Ref GlossaryTable


  FrontendBucketName:
    Description: "Name of the frontend hosting bucket"
    Value: !Ref FrontendBucket


  FrontendWebsiteUrl:
    Description: "URL of the static website hosted on S3"
    Value: !Sub "http://${FrontendBucket}.s3-website.${AWS::Region}.amazonaws.com"  


  CloudFrontUrl:
    Description: "HTTPS URL of the site served via CloudFront"
    Value: !Sub "https://${FrontendDistribution.DomainName}"
